<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Report Submitted | ukbigdave.dev</title>
  <style>
    :root { color-scheme: light; --bg: #f6f7f9; --surface: #fff; --text: #20242a; --muted: #5f6975; --border: #d9dee5; --accent-strong: #26394d; --shadow: 0 18px 45px rgba(32,36,42,.08); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; color: var(--text); background: linear-gradient(180deg, #eef1f5 0%, var(--bg) 38%, #fff 100%); }
    .site-header { border-bottom: 1px solid var(--border); background: rgba(255,255,255,.9); }
    .header-inner { max-width: 860px; margin: 0 auto; padding: 1rem 1.25rem; }
    .brand { font-weight: 750; letter-spacing: -.02em; color: var(--text); text-decoration: none; font-size: 1.1rem; }
    .brand:hover, .brand:focus { color: var(--accent-strong); }
    main { max-width: 860px; margin: 0 auto; padding: 3rem 1.25rem; }
    .hero { padding: clamp(2rem, 5vw, 4rem); border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
    h1 { margin: 0; font-size: clamp(2.15rem, 6vw, 4.2rem); line-height: 1.05; letter-spacing: -.05em; }
    .lead { max-width: 760px; margin: 1.25rem 0 0; color: var(--muted); font-size: clamp(1.05rem, 2.5vw, 1.25rem); }
    .footer { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 3rem; color: var(--muted); font-size: .95rem; border-top: 1px solid var(--border); }
    @media (max-width: 600px) { main { padding-top: 2rem; } .hero { padding: 1.5rem; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner"><a class="brand" href="../../index.html">ukbigdave.dev</a></div>
  </header>

  <main>
    <section class="hero">
      <h1>Report submitted</h1>
      <p class="lead">Thanks. Your report has been sent.</p>
      <p class="lead">If this is a temporary Discord service issue, it may resolve without intervention. There's no need to submit the same problem again.</p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 ukbigdave. ukbigdave.dev.</p>
  </footer>
</body>
</html>
